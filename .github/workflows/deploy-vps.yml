name: Deploy VPS

on:
  push:
    branches:
      - stg
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    if: github.ref_name == 'stg' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://dimensiones.cloud' || 'https://stg.dimensiones.cloud' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Run automated tests
        run: |
          npm ci
          npx prisma generate
          npm run test:run

      - name: Resolve deployment settings
        id: settings
        shell: bash
        run: |
          echo "image_ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            echo "environment_name=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment_name=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        env:
          IMAGE_REF: ${{ steps.settings.outputs.image_ref }}
        run: |
          docker build --tag "$IMAGE_REF" .
          docker push "$IMAGE_REF"
          docker save "$IMAGE_REF" | gzip > /tmp/sistema-obras-image.tar.gz

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Transfer deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p /opt/sistema-obras/releases"
          scp -P "$VPS_PORT" docker-compose.vps.yml deploy/deploy-image.sh \
            "$VPS_USER@$VPS_HOST:/opt/sistema-obras/app/"
          scp -P "$VPS_PORT" /tmp/sistema-obras-image.tar.gz \
            "$VPS_USER@$VPS_HOST:/opt/sistema-obras/releases/${GITHUB_SHA}.tar.gz"

      - name: Deploy image
        env:
          ENVIRONMENT_NAME: ${{ steps.settings.outputs.environment_name }}
          IMAGE_REF: ${{ steps.settings.outputs.image_ref }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "chmod 700 /opt/sistema-obras/app/deploy-image.sh && /opt/sistema-obras/app/deploy-image.sh '$ENVIRONMENT_NAME' '$IMAGE_REF' '/opt/sistema-obras/releases/${GITHUB_SHA}.tar.gz'"

      - name: Verify public endpoint
        env:
          HEALTH_URL: ${{ github.ref_name == 'main' && 'https://dimensiones.cloud/api/v1/health' || 'https://stg.dimensiones.cloud/api/v1/health' }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "$HEALTH_URL"
