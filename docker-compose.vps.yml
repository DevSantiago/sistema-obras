services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file:
      - deploy/env/vps.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  app-stg:
    build:
      context: .
      dockerfile: Dockerfile
    image: sistema-obras:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - deploy/env/stg.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
      - web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  app-prod:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile
    image: sistema-obras:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - deploy/env/prod.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
      - web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - deploy/env/vps.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app-stg:
        condition: service_healthy
    networks:
      - web

  backup:
    profiles: ["operations"]
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    env_file:
      - deploy/env/vps.env
      - deploy/env/backup.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  database:
    internal: true
  web:
